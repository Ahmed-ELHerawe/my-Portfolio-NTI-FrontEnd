<header class="fixed top-0 left-0 right-0 z-50 h-16 backdrop-blur-md bg-white/80 dark:bg-slate-950/80 border-b border-slate-200 dark:border-slate-800">
  <div class="h-full px-4 sm:px-6 flex items-center justify-between">

    <!-- Menu button (mobile) + Logo -->
    <div class="flex items-center gap-3">
      <button type="button" (click)="menuToggle.emit()" aria-label="Toggle menu"
        class="lg:hidden p-2 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white focus:outline-hidden">
        <i class="fas fa-bars text-xl"></i>
      </button>

      <a routerLink="/dashboard/overview" class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-linear-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-bold shadow-lg shadow-blue-500/20">
          &lt;/&gt;
        </div>
        <span class="font-bold text-lg text-slate-900 dark:text-white">
          Dev<span class="text-blue-500">.Admin</span>
        </span>
      </a>
    </div>

    <!-- Actions -->
    <div class="flex items-center gap-2 sm:gap-3">

      <a routerLink="/" target="_blank"
        class="hidden sm:inline-flex items-center gap-2 px-4 py-2 rounded-xl text-sm font-semibold text-slate-600 dark:text-slate-300 hover:text-blue-500 dark:hover:text-blue-400 transition-colors">
        View Site <i class="fas fa-arrow-up-right-from-square text-xs"></i>
      </a>

      <button type="button" (click)="themeService.toggle()" aria-label="Toggle theme"
        class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all">
        <i class="fas" [class.fa-moon]="themeService.isDark" [class.fa-sun]="!themeService.isDark" [class.text-amber-500]="!themeService.isDark"></i>
      </button>

      <!-- Notifications: الرسايل الجديدة -->
      <a routerLink="/dashboard/messages" aria-label="Messages"
        class="relative p-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all">
        <i class="fas fa-bell"></i>
        @if(unread > 0){
          <span class="absolute -top-1.5 -right-1.5 min-w-5 h-5 px-1 rounded-full bg-pink-500 text-white text-[10px] font-bold flex items-center justify-center">
            {{unread > 99 ? '99+' : unread}}
          </span>
        }
      </a>

      <!-- Profile -->
      <a routerLink="/dashboard/manage-profile" aria-label="Edit profile"
        class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-all">
        <i class="fas fa-user"></i>
      </a>

      <!-- Logout -->
      <button type="button" (click)="logout()"
        class="px-4 py-2.5 rounded-xl text-sm font-bold bg-red-500/10 text-red-600 dark:text-red-400 hover:bg-red-500/20 transition-all">
        <i class="fas fa-right-from-bracket sm:mr-2"></i><span class="hidden sm:inline">Logout</span>
      </button>
    </div>
  </div>
</header>
