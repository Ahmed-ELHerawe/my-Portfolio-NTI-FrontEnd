<!-- خلفية معتمة على الموبايل لما القايمة تتفتح -->
@if(open){
  <div class="fixed inset-0 top-16 z-30 bg-slate-950/50 lg:hidden" (click)="closed.emit()"></div>
}

<aside class="fixed left-0 top-16 bottom-0 z-40 w-64 overflow-y-auto bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 transition-transform duration-300 lg:translate-x-0"
  [class]="open ? 'translate-x-0' : '-translate-x-full'">

  <nav class="p-4 space-y-1 text-slate-600 dark:text-slate-400">
    @for(link of links; track link.path){
      <a [routerLink]="link.path" routerLinkActive="bg-blue-500/10 text-blue-600 dark:text-blue-400" (click)="closed.emit()"
        class="flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
        <i class="w-5 text-center" [class]="link.icon"></i>
        {{link.name}}
      </a>
    }
  </nav>
</aside>
