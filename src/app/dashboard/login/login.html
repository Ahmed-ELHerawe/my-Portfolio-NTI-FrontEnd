<div class="relative isolate min-h-screen flex items-center justify-center px-4 py-12 overflow-hidden">

  <div class="absolute top-1/4 left-10 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl -z-10 animate-pulse-slow"></div>
  <div class="absolute bottom-1/4 right-10 w-96 h-96 bg-purple-600/20 rounded-full blur-3xl -z-10 animate-pulse-slow"></div>

  <div class="w-full max-w-md">

    <div class="flex flex-col items-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-linear-to-tr from-blue-600 to-indigo-500 flex items-center justify-center text-white font-bold text-2xl shadow-lg shadow-blue-500/20 mb-4">
        &lt;/&gt;
      </div>
      <h1 class="text-3xl font-extrabold text-slate-900 dark:text-white">Admin Login</h1>
      <p class="text-slate-500 dark:text-slate-400 text-sm mt-2">Sign in to manage your portfolio</p>
    </div>

    <form [formGroup]="myForm" (ngSubmit)="login()" novalidate class="glass-card p-8 rounded-3xl space-y-6">

      <div>
        <label for="login-email" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Email</label>
        <input id="login-email" type="email" formControlName="email" placeholder="admin@example.com" autocomplete="username" [class]="inputClass(email)">
        @if(isInvalid(email)){
          @if(email?.errors?.['required']){
            <p class="text-red-500 text-xs mt-1">Email is required</p>
          }
          @else{
            <p class="text-red-500 text-xs mt-1">Wrong email format</p>
          }
        }
      </div>

      <div>
        <label for="login-password" class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-2">Password</label>
        <div class="relative">
          <input id="login-password" [type]="showPassword ? 'text' : 'password'" formControlName="password" placeholder="Enter password" autocomplete="current-password" [class]="inputClass(password, 'pr-12')">
          <button type="button" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
            class="absolute inset-y-0 right-0 px-4 text-slate-400 hover:text-slate-700 dark:hover:text-slate-200">
            <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword"></i>
          </button>
        </div>
        @if(isInvalid(password)){
          <p class="text-red-500 text-xs mt-1">Password is required</p>
        }
      </div>

      <button type="submit"
        class="w-full py-3.5 rounded-xl bg-linear-to-r from-blue-600 to-indigo-600 text-white font-bold shadow-xl shadow-blue-600/20 hover:scale-[1.01] active:scale-95 transition-all">
        Sign In <i class="fas fa-arrow-right ml-2"></i>
      </button>
    </form>

    <p class="text-center mt-6">
      <a routerLink="/" class="text-sm text-slate-500 dark:text-slate-400 hover:text-blue-500 dark:hover:text-blue-400 transition-colors">
        <i class="fas fa-arrow-left mr-1"></i> Back to website
      </a>
    </p>
  </div>
</div>
