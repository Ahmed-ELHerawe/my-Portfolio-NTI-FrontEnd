<div class="flex flex-wrap items-center justify-between gap-4 mb-8">
  <div>
    <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white">Dashboard Overview</h1>
    <p class="text-slate-500 dark:text-slate-400 text-sm mt-1">A quick look at your portfolio content</p>
  </div>
  <a routerLink="/" target="_blank"
    class="px-5 py-2.5 rounded-xl text-sm font-bold bg-linear-to-r from-blue-600 to-indigo-600 text-white shadow-lg shadow-blue-600/25 hover:scale-105 active:scale-95 transition-all">
    View Website <i class="fas fa-arrow-up-right-from-square ml-2"></i>
  </a>
</div>

<div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6">
  @for(card of cards; track card.key){
    <a [routerLink]="card.link" class="glass-card p-6 rounded-2xl flex items-center gap-5 hover:border-blue-500/50 transition-colors">
      <div class="w-14 h-14 rounded-2xl flex items-center justify-center text-2xl shrink-0" [class]="card.box">
        <i [class]="card.icon"></i>
      </div>
      <div>
        <div class="text-3xl font-extrabold text-slate-900 dark:text-white">{{stats ? stats[card.key] : '-'}}</div>
        <div class="text-sm text-slate-500 dark:text-slate-400 font-semibold">{{card.label}}</div>
      </div>
    </a>
  }
</div>
