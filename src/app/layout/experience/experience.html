<section id="experience" class="py-24 relative">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="text-center max-w-3xl mx-auto mb-16">
      <h2 class="text-blue-600 dark:text-blue-500 font-bold text-sm tracking-wider uppercase mb-2">CAREER TIMELINE</h2>
      <p class="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-white">Work Experience &amp; History</p>
    </div>

    @if(items.length){
      <div class="max-w-4xl mx-auto relative border-l-2 border-slate-300 dark:border-slate-800 pl-8 space-y-12">
        @for(item of items; track item._id; let i = $index){
          <div class="relative">
            <span class="absolute -left-10 top-1 w-5 h-5 rounded-full ring-8 ring-slate-50 dark:ring-slate-950" [class]="color(i).dot"></span>
            <div class="glass-card p-6 rounded-2xl">
              <div class="flex flex-wrap justify-between items-center gap-2 mb-2">
                <h3 class="text-xl font-bold text-slate-900 dark:text-white">{{item.role}}</h3>
                <span class="text-xs font-bold px-3 py-1 rounded-full" [class]="color(i).badge">{{period(item)}}</span>
              </div>
              <div class="text-sm font-semibold text-slate-500 dark:text-slate-400 mb-4">{{item.company}}</div>
              <p class="text-slate-600 dark:text-slate-300 text-sm leading-relaxed whitespace-pre-line">{{item.desc}}</p>
            </div>
          </div>
        }
      </div>
    }
    @else if(loaded){
      <p class="text-center text-slate-500 dark:text-slate-400">Experience will appear here soon.</p>
    }
  </div>
</section>
