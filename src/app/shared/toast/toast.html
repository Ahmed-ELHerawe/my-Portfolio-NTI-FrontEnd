@if(toastService.toast$ | async; as toast){
  <div class="fixed bottom-6 right-6 z-60 max-w-sm text-white px-6 py-3 rounded-2xl shadow-2xl flex items-center gap-3"
    role="status" [class]="toast.type == 'success' ? 'bg-emerald-600' : 'bg-red-600'">
    <i class="text-xl" [class]="toast.type == 'success' ? 'fas fa-circle-check' : 'fas fa-circle-exclamation'"></i>
    <span class="text-sm font-semibold">{{toast.message}}</span>
    <button type="button" (click)="toastService.hide()" aria-label="Close" class="ml-2 text-white/70 hover:text-white">
      <i class="fas fa-times"></i>
    </button>
  </div>
}
